<!DOCTYPE html>
<html lang="ja">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1119">
  <meta name="description" content="歩いて、止まって、360°を残す。Osmo 360用の歩行撮影コントローラー。">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <title>Osmo 360 Shutter</title>
  <style>body{margin:0;background:#0b1119;color:#e3edf4;font:14px system-ui,sans-serif}#loading{min-height:100dvh;display:grid;place-content:center;text-align:center;gap:12px}#loading strong{color:#65e0db;font-size:30px;letter-spacing:3px}#loading span{color:#8e9eaf}noscript{display:block;padding:24px}</style>
  <script src="device_bridge.js"></script>
  <script src="map_host.js"></script>
</head>
<body>
  <div id="loading" role="status"><strong>OSMO 360</strong><span>Walk. Stop. Capture.</span><span>アプリを読み込んでいます…</span></div>
  <noscript>このアプリにはJavaScriptが必要です。</noscript>
  <script>
    window.addEventListener('flutter-first-frame',()=>document.getElementById('loading')?.remove());
    if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(console.warn));
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
