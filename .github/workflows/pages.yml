name: Verify and publish Flutter PWA
on:
  push:
    branches: [osmo360-shutter-app]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: node --test test/*_test.cjs
      - run: python3 tool/make_icons.py
      - run: flutter build web --release --base-href /osmo360-shutter-app/ --pwa-strategy=none --no-web-resources-cdn
      - run: python3 tool/build_pwa.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-dart-sources
          path: |
            lib/
            test/
            pubspec.lock
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web-release
          path: build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published PWA assets
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 tool/verify_public.py
